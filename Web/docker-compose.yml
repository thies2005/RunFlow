services:
  app:
    build: .
    container_name: runflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-runflow}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_VERIFY_TOKEN=${STRAVA_VERIFY_TOKEN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # M-10 fix: Add Sentry environment variables for error tracking
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      permissions-fixer:
        condition: service_completed_successfully
    networks:
      - runflow-network
    volumes:
      - ./backups:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    # M-08 fix: Add resource limits for app container
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    # M-09 fix: Add log rotation to prevent disk filling
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  permissions-fixer:
    # M-11 fix: Pin alpine version for reproducible builds
    image: alpine:3.19
    container_name: runflow-permissions-fixer
    command: sh -c "mkdir -p /backups && chown -R 1001:1001 /backups && chmod -R 775 /backups"
    volumes:
      - ./backups:/backups
    networks:
      - runflow-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: runflow-migrator
    command: sh -c "node_modules/.bin/prisma migrate deploy"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-runflow}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - runflow-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: runflow-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-runflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-runflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-runflow} -d ${POSTGRES_DB:-runflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - runflow-network
    # M-08 fix: Add resource limits for database container
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    # M-12 fix: Pin backup image version for security
    image: prodrigestivill/postgres-backup-local:16
    container_name: runflow-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-runflow}
      - POSTGRES_USER=${POSTGRES_USER:-runflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - SCHEDULE=@every 6h
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - runflow-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    # M-11 fix: Pin cloudflared version for reproducible builds
    image: cloudflare/cloudflared:latest
    container_name: runflow-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - runflow-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  runflow-network:
    driver: bridge

volumes:
  postgres_data:

name: runflow_flutter
description: "RunFlow running performance dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  google_fonts: ^6.2.1

  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  go_router: ^17.2.2

  dio: ^5.9.2
  http: ^1.4.0

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  fl_chart: ^1.2.0

  sqlite3_flutter_libs: ^0.5.0

  flutter_secure_storage: ^10.0.0

  health: ^13.3.1

  flutter_local_notifications: ^21.0.0

  firebase_messaging: ^16.2.0

  workmanager: ^0.9.0

  app_links: ^7.0.0

  share_plus: ^12.0.0

  flutter_web_auth_2: ^5.0.2

  flutter_markdown: ^0.7.7+1

  table_calendar: ^3.2.0

  flutter_native_splash: ^2.4.7

  sentry_flutter: ^9.19.0

  shared_preferences: ^2.5.3
  firebase_core: ^4.7.0
  timezone: ^0.11.0
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3: ^3.3.1
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  universal_ble: ^1.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  mocktail: ^1.0.4

  build_runner: ^2.5.4

  riverpod_generator: ^4.0.3

  freezed: ^3.2.5

  json_serializable: ^6.9.5

  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  shaders:
    - shaders/ink_sparkle.frag

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  android: true
  ios: false
  android_12:
    color: "#000000"
    color_dark: "#000000"

flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  image_path: "assets/icon/icon.png"

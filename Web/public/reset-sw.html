<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Service Worker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background: #dc2626;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>App Recovery</h1>
        <p>If you are experiencing issues with the app (white screen, stuck loading), click the button below to reset the local cache.</p>
        <button onclick="resetApp()">Reset App & Reload</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function resetApp() {
            const status = document.getElementById('status');
            status.textContent = "Unregistering service workers...";
            
            try {
                // 1. Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }

                // 2. Clear all caches
                status.textContent = "Clearing caches...";
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }

                // 3. Clear storage (optional but good for hard reset)
                // localStorage.clear(); // Commented out to preserve user preferences if possible
                // sessionStorage.clear();

                status.textContent = "Done! Reloading...";
                
                // 4. Force reload from server
                window.location.href = '/';
            } catch (error) {
                console.error(error);
                status.textContent = "Error during reset: " + error.message;
            }
        }
    </script>
</body>
</html>

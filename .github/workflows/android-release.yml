name: Android release channels

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts from master or a matching stable tag
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: runflow-android-release-channel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate source, channel, and ancestry before accessing signing credentials
        id: version
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/android_release.py prepare
      - name: Check release helper edge cases
        run: python3 -m unittest discover -s scripts/tests -p 'test_android_release.py'
      - name: Compile, tests, and lint
        working-directory: android
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:compileDebugKotlin testDebugUnitTest lintDebug
      - name: Configure and verify existing release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 scripts/android_release.py signing
      - name: Build signed APK and AAB
        working-directory: android
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease bundleRelease
      - name: Fetch official bundletool for AAB manifest verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.18.3 --repo google/bundletool --pattern bundletool-all-1.18.3.jar --dir "$RUNNER_TEMP"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool-all-1.18.3.jar" | sha256sum --check
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool-all-1.18.3.jar" >> "$GITHUB_ENV"
      - name: Verify package, versions, signatures, and checksums
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 scripts/android_release.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runflow-${{ steps.version.outputs.version_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified release with recoverable uploads
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 scripts/android_release.py publish
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/runflow-release.keystore"

# =============================================================
# RunFlow - Coolify Deployment Compose File
# =============================================================
# Use this file when deploying via Coolify (Docker Compose resource).
# Set Build Pack to "Docker Compose" and point to this file.
#
# Key differences from docker-compose.yml:
#  - No tunnel service (Coolify's built-in proxy handles HTTPS)
#  - No host port mappings (Coolify routes traffic internally)
#  - SERVICE_FQDN_APP tells Coolify which container to expose
#  - DATABASE_URL uses internal service name "db"
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Coolify reads SERVICE_FQDN_APP to route external traffic here
    # Note: The healthcheck with a 300s start_period serves as a readiness check
    # Coolify's Traefik proxy will only route traffic once the healthcheck passes
    environment:
      - SERVICE_FQDN_APP=${SERVICE_FQDN_APP}
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=8192
      - DATABASE_URL=postgresql://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-runflow}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_VERIFY_TOKEN=${STRAVA_VERIFY_TOKEN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-24h}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-30d}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - FATSECRET_CLIENT_ID=${FATSECRET_CLIENT_ID}
      - FATSECRET_CLIENT_SECRET=${FATSECRET_CLIENT_SECRET}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      permissions-fixer:
        condition: service_completed_successfully
    networks:
      - coolify
    volumes:
      - backups:/app/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider --method=HEAD http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      start_period: 120s
      start_interval: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  permissions-fixer:
    image: alpine:3.22
    command: sh -c "mkdir -p /backups && chown -R 1001:1001 /backups && chmod -R 775 /backups"
    restart: "no"
    volumes:
      - backups:/backups
    networks:
      - coolify
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command:
      - sh
      - -c
      - |
          apk add --no-cache postgresql-client 2>/dev/null || apk add --no-cache postgresql-client
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h db -U ${POSTGRES_USER:-runflow} -d ${POSTGRES_DB:-runflow} -c "DELETE FROM public._prisma_migrations WHERE migration_name IN ('00000000000000_init', '20250212120000_optimize_activity_indexes');" 2>/dev/null || true
          node_modules/.bin/prisma migrate deploy
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-runflow}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-runflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-runflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-runflow} -d ${POSTGRES_DB:-runflow}",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 5
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 5
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-runflow}
      - POSTGRES_USER=${POSTGRES_USER:-runflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - SCHEDULE=@every 6h
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080 || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reminder-cron:
    image: alpine:3.22
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "while true; do
        wget -q -O- --header=\"Authorization: Bearer $${CRON_SECRET}\" $${APP_BASE_URL}/api/cron/reminders || true;
        sleep 300;
      done"
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-http://app:3000}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'while true; do' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  feedback-queue-cron:
    image: alpine:3.22
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "while true; do
        wget -q -O- --header=\"x-internal-secret:$$CRON_SECRET\" --post-data='{}' $${APP_BASE_URL}/api/internal/process-feedback-queue || true;
        sleep 60;
      done"
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-http://app:3000}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'while true; do' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  backups:
  redis_data:
